name: Weekly link check
on:
  schedule: [{ cron: '0 6 * * 1' }]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - id: check
        run: node scripts/check-links.mjs | tee linkcheck.txt
        continue-on-error: true
      - name: Open an issue if links are broken
        if: steps.check.outcome == 'failure'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh issue create --title "Broken deal links ($(date -u +%F))" --label "broken-link" --body-file linkcheck.txt
